name: Enviar Lembretes de Visita

on:
  schedule:
    # Roda todo dia às 9h (horário UTC, ajuste conforme necessário)
    # 9h Brasília = 12h UTC (UTC-3)
    - cron: '0 12 * * *'

  # Permite rodar manualmente
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Criar arquivo .env
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env
          echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env
          echo "TWILIO_WHATSAPP_NUMBER=${{ secrets.TWILIO_WHATSAPP_NUMBER }}" >> .env
          echo "WHATSAPP_ADMIN_PHONE=${{ secrets.WHATSAPP_ADMIN_PHONE }}" >> .env

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Enviar lembretes
        run: node scripts/send-appointment-reminders.js
